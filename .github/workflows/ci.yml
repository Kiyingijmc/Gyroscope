name: Gyroscope CI Quality Gates

on:
  push:
    branches: [ main, "foundation/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Verify Package Importability
        run: |
          python -c "import gyroscope; print('Gyroscope package import verified!')"

      - name: Run Pytest Suite
        run: |
          pytest -v
